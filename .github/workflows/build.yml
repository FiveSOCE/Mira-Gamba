name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MiraGamba-${{ steps.version.outputs.version }}
          path: build/libs/MiraGamba-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          JAR="build/libs/MiraGamba-$VERSION.jar"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --target "${{ github.sha }}" \
              --title "MiraGamba $TAG" \
              --notes "Adds a physical Four Guess card table alongside slots: Red/Black, Higher/Lower, Inside/Outside and Suit. Uses a shuffled 52-card deck with no duplicate draw in a run, labeled physical buttons, named revealed cards and a configurable 10x completion payout."
          fi
