name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MiraGamba-0.1.0
          path: build/libs/MiraGamba-0.1.0.jar
          if-no-files-found: error

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v0.1.0" >/dev/null 2>&1; then
            gh release create "v0.1.0" "build/libs/MiraGamba-0.1.0.jar" \
              --target "${{ github.sha }}" \
              --title "MiraGamba v0.1.0" \
              --notes "Physical 3x3 in-world slot machines with Vault economy wagers, weighted symbols, five paylines, configurable payouts, and $5k/$50k/$100k machine tiers."
          fi
